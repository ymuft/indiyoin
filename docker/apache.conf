<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>
    <Directory /var/www/html>
        Options -Indexes
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>
</VirtualHost>
