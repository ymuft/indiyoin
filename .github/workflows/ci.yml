name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, zip, gd, dom, simplexml, xml, xmlreader, xmlwriter
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist

      - name: Capture Composer lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1

      - name: Version generated lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "composer.lock already versioned and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock Composer dependencies"
          git push

      - run: composer lint
      - run: composer test

      - name: Frontend syntax
        run: node --check public/assets/dashboard.js

      - name: AppFoundry + PPV end-to-end smoke test
        shell: bash
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_DATABASE=${RUNNER_TEMP}/indiyoin.sqlite" >> .env
          php scripts/migrate.php
          php scripts/create-admin.php --name="CI Admin" --email="ci@example.com" --password="capacity-test-123"
          php scripts/create-demo-ppv.php "${RUNNER_TEMP}/demo.xlsx"

          php -S 127.0.0.1:8080 -t public public/index.php >"${RUNNER_TEMP}/indiyoin-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT
          sleep 2

          curl -fsS http://127.0.0.1:8080/health | grep '"status":"ok"'
          curl -fsS -c "${RUNNER_TEMP}/cookies.txt" http://127.0.0.1:8080/login > "${RUNNER_TEMP}/login.html"
          CSRF=$(grep -oP 'name="_csrf" value="\K[^"]+' "${RUNNER_TEMP}/login.html" | head -1)
          test -n "$CSRF"

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -b "${RUNNER_TEMP}/cookies.txt" -c "${RUNNER_TEMP}/cookies.txt" \
            -X POST http://127.0.0.1:8080/login \
            --data-urlencode "_csrf=${CSRF}" \
            --data-urlencode "email=ci@example.com" \
            --data-urlencode "password=capacity-test-123")
          test "$STATUS" = "302"

          curl -fsS -b "${RUNNER_TEMP}/cookies.txt" http://127.0.0.1:8080/ > "${RUNNER_TEMP}/dashboard.html"
          grep -q 'Importar PPV' "${RUNNER_TEMP}/dashboard.html"
          DASH_CSRF=$(grep -oP 'name="_csrf" value="\K[^"]+' "${RUNNER_TEMP}/dashboard.html" | head -1)
          test -n "$DASH_CSRF"

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -b "${RUNNER_TEMP}/cookies.txt" -c "${RUNNER_TEMP}/cookies.txt" \
            -X POST http://127.0.0.1:8080/import \
            -F "_csrf=${DASH_CSRF}" \
            -F "ppv=@${RUNNER_TEMP}/demo.xlsx;type=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")
          test "$STATUS" = "302"

          curl -fsS -b "${RUNNER_TEMP}/cookies.txt" http://127.0.0.1:8080/ > "${RUNNER_TEMP}/analysis.html"
          grep -q 'Visão de capacidade' "${RUNNER_TEMP}/analysis.html"
          grep -q 'THB 5.0' "${RUNNER_TEMP}/analysis.html"
          grep -q 'K62H' "${RUNNER_TEMP}/analysis.html"
          grep -q 'COMPOSIÇÃO DA CARGA' "${RUNNER_TEMP}/analysis.html"

      - name: Build Docker image
        run: docker build -t indiyoin-ci .
